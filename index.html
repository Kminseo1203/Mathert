let selectedUnits = new Set();
let unitStudyOpen = false;
let unitStatsCache = {};

function toggleUnitStudy(){
  unitStudyOpen = !unitStudyOpen;
  document.getElementById('unit-study-section').style.display = unitStudyOpen ? 'block' : 'none';
  document.getElementById('unit-toggle-btn').textContent = unitStudyOpen ? '접기' : '펼치기';
  if(unitStudyOpen) renderUnitStudyGrid();
}

async function renderUnitStudyGrid(){
  const grid = document.getElementById('unit-study-grid');
  grid.innerHTML = '';
  // 단원별 정답률 불러오기
  if(currentUser && Object.keys(unitStatsCache).length === 0){
    try{
      const res = await fetch(`${API}/api/unit_stats`,{headers:{Authorization:`Bearer ${authToken}`}});
      const data = await res.json();
      (data.stats||[]).forEach(s=>{ unitStatsCache[s.unit] = s; });
    }catch(e){}
  }
  const gradeNames = {e1:'초1',e2:'초2',e3:'초3',e4:'초4',e5:'초5',e6:'초6',m1:'중1',m2:'중2',m3:'중3',h1:'고1',h2:'고2',h3:'고3'};
  Object.entries(ALL_UNITS).forEach(([gid, units])=>{
    // 학년 라벨
    const label = document.createElement('div');
    label.className = 'section-label';
    label.style.marginTop = '8px';
    label.textContent = gradeNames[gid];
    grid.appendChild(label);
    // 칩 행
    const row = document.createElement('div');
    row.className = 'quick-row';
    units.forEach(([unit])=>{
      const stat = unitStatsCache[unit];
      const acc = stat ? Math.round(stat.correct/stat.total*100) : null;
      const accColor = acc===null?'':acc>=80?'var(--green)':acc>=50?'var(--yellow)':'var(--red)';
      const btn = document.createElement('button');
      btn.className = 'chip' + (selectedUnits.has(unit)?' selected':'');
      btn.style.cssText = selectedUnits.has(unit)?'border-color:var(--blue);color:var(--blue);background:var(--blue-light);':'';
      btn.innerHTML = unit + (acc!==null?` <span style="font-size:10px;color:${accColor};font-weight:800;">${acc}%</span>`:'');
      btn.onclick = () => {
        if(selectedUnits.has(unit)){
          selectedUnits.delete(unit);
          btn.style.cssText='';
        }else{
          selectedUnits.add(unit);
          btn.style.cssText='border-color:var(--blue);color:var(--blue);background:var(--blue-light);';
        }
      };
      row.appendChild(btn);
    });
    grid.appendChild(row);
  });
}

function clearUnitStudy(){
  selectedUnits.clear();
  document.querySelectorAll('.unit-study-btn').forEach(b=>b.classList.remove('selected'));
}

// ── 난이도 & 타이머 설정 ─────────────────────────────────────────
let difficulty = 'normal';
let timerSeconds = 0;
let timerInterval = null;
let timeLeft = 0;

function selectDiff(d){
  difficulty = d;
  document.querySelectorAll('[data-diff]').forEach(b=>{
    b.classList.toggle('selected', b.dataset.diff === d);
  });
}

function selectTimer(t){
  timerSeconds = t;
  document.querySelectorAll('[data-timer]').forEach(b=>{
    b.classList.toggle('selected', parseInt(b.dataset.timer) === t);
  });
}

function startTimer(){
  clearInterval(timerInterval);
  if(!timerSeconds){
    document.getElementById('timer-bar').style.display='none';
    document.getElementById('timer-text').style.display='none';
    return;
  }
  timeLeft = timerSeconds;
  document.getElementById('timer-bar').style.display='block';
  document.getElementById('timer-text').style.display='block';
  updateTimerUI();
  timerInterval=setInterval(()=>{
    timeLeft--;
    updateTimerUI();
    if(timeLeft<=0){
      clearInterval(timerInterval);
      // 시간 초과 처리
      document.querySelectorAll('.opt-btn').forEach(b=>b.disabled=true);
      document.getElementById('ans-input').disabled=true;
      document.getElementById('confirm-btn').disabled=true;
      total++;
      streak=0;
      document.getElementById('question-card').className='question-card wrong';
      const fb=document.getElementById('feedback');
      fb.className='feedback wrong show';
      fb.innerHTML=`<div class="feedback-top">⏰ 시간 초과!</div><div class="feedback-answer">정답: ${curAnswer}</div>`;
      updateStats();
      document.getElementById('next-btn').style.display='block';
      // 오답 저장
      if(currentUser&&curFeedback)saveWrongNote(curFeedback);
    }
  },1000);
}

function updateTimerUI(){
  const pct=timeLeft/timerSeconds*100;
  const fill=document.getElementById('timer-fill');
  const text=document.getElementById('timer-text');
  fill.style.width=pct+'%';
  fill.style.background=pct>50?'var(--green)':pct>25?'var(--yellow)':'var(--red)';
  text.textContent=`⏱ ${timeLeft}초`;
  text.className='timer-text'+(pct<=50?' warn':'')+(pct<=25?' danger':'');
}

function stopTimer(){clearInterval(timerInterval);}

// ── 오답 노트 ────────────────────────────────────────────────────
async function saveWrongNote(q){
  if(!authToken||!currentUser)return;
  try{
    await fetch(`${API}/api/wrong_notes`,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${authToken}`},
      body:JSON.stringify({
        grade:q.unit,unit:q.unit,
        question:q.question,answer:q.answer,
        steps:q.steps,concept:q.concept
      }),
    });
    // 배지 업데이트
    updateWrongBadge();
  }catch(e){}
}

async function updateWrongBadge(){
  if(!authToken)return;
  try{
    const res=await fetch(`${API}/api/wrong_notes`,{headers:{Authorization:`Bearer ${authToken}`}});
    const data=await res.json();
    const badge=document.getElementById('wrong-badge');
    const count=data.notes?.length||0;
    badge.textContent=count;
    badge.style.display=count>0?'inline':'none';
  }catch(e){}
}

async function loadWrongNotes(){
  if(!currentUser){
    document.getElementById('wrong-list').innerHTML='<div class="empty-ranking">로그인이 필요해요</div>';
    return;
  }
  const list=document.getElementById('wrong-list');
  list.innerHTML='<div class="empty-ranking">불러오는 중…</div>';
  try{
    const res=await fetch(`${API}/api/wrong_notes`,{headers:{Authorization:`Bearer ${authToken}`}});
    const data=await res.json();
    if(!data.notes||data.notes.length===0){
      list.innerHTML='<div class="empty-ranking">오답이 없어요! 👍</div>';
      return;
    }
    list.innerHTML='';
    data.notes.forEach(n=>{
      let steps=[];
      try{steps=JSON.parse(n.steps)||[];}catch(e){}
      const stepsHtml=steps.map((s,i)=>`<div class="step"><span class="step-num">${i+1}</span><div class="step-body">${s.title?`<div class="step-title">${s.title}</div>`:''}<div class="step-calc">${s.calc||''}</div></div></div>`).join('');
      list.innerHTML+=`<div class="wrong-note-card" id="note-${n.id}">
        <div class="wrong-note-header">
          <span class="wrong-note-grade">${n.grade||'—'}</span>
          <span class="wrong-note-unit">${n.unit||''}</span>
        </div>
        <div class="wrong-note-q">${n.question}</div>
        <div class="wrong-note-ans">정답: <strong>${n.answer}</strong></div>
        ${stepsHtml?`<div class="steps" style="margin-bottom:10px">${stepsHtml}</div>`:''}
        ${n.concept?`<div class="concept-box"><div class="concept-label">핵심 개념</div><div class="concept-text">${n.concept}</div></div>`:''}
        <div class="wrong-note-btns" style="margin-top:10px">
          <button class="solve-btn" onclick="solveNote(${n.id})">✅ 이해했어요</button>
          <button class="del-note-btn" onclick="deleteNote(${n.id})">🗑</button>
        </div>
      </div>`;
    });
  }catch(e){list.innerHTML='<div class="empty-ranking">불러오지 못했어요.</div>';}
}

async function solveNote(id){
  try{
    await fetch(`${API}/api/wrong_notes`,{method:'PUT',headers:{'Content-Type':'application/json','Authorization':`Bearer ${authToken}`},body:JSON.stringify({id})});
    document.getElementById(`note-${id}`).remove();
    updateWrongBadge();
    showToast('✅ 오답 노트에서 제거됐어요!');
  }catch(e){}
}

async function deleteNote(id){
  try{
    await fetch(`${API}/api/wrong_notes`,{method:'DELETE',headers:{'Content-Type':'application/json','Authorization':`Bearer ${authToken}`},body:JSON.stringify({id})});
    document.getElementById(`note-${id}`).remove();
    updateWrongBadge();
  }catch(e){}
}

// ── 단원별 통계 ──────────────────────────────────────────────────
async function loadUnitStats(){
  if(!currentUser){
    document.getElementById('stats-list').innerHTML='<div class="empty-ranking">로그인이 필요해요</div>';
    return;
  }
  const list=document.getElementById('stats-list');
  list.innerHTML='<div class="empty-ranking">불러오는 중…</div>';
  try{
    const res=await fetch(`${API}/api/unit_stats`,{headers:{Authorization:`Bearer ${authToken}`}});
    const data=await res.json();
    if(!data.stats||data.stats.length===0){
      list.innerHTML='<div class="empty-ranking">아직 기록이 없어요</div>';
      return;
    }
    // 정답률 낮은 순 (취약 단원)
    const sorted=[...data.stats].sort((a,b)=>a.accuracy-b.accuracy);
    list.innerHTML='<div style="font-size:13px;font-weight:700;color:var(--text-secondary);margin-bottom:12px;">⚠️ 취약 단원 순</div>';
    sorted.forEach(s=>{
      const acc=s.accuracy||0;
      const color=acc>=80?'var(--green)':acc>=50?'var(--yellow)':'var(--red)';
      list.innerHTML+=`<div class="unit-stat-row">
        <div class="unit-stat-top">
          <span class="unit-stat-name">${s.unit}</span>
          <span class="unit-stat-acc" style="color:${color}">${acc}%</span>
        </div>
        <div class="unit-stat-bar"><div class="unit-stat-fill" style="width:${acc}%;background:${color}"></div></div>
        <div class="unit-stat-count">${s.correct}/${s.total}문제 정답</div>
      </div>`;
    });
  }catch(e){list.innerHTML='<div class="empty-ranking">불러오지 못했어요.</div>';}
}

// ── 점수 공유 ────────────────────────────────────────────────────
function shareScore(){
  const text=`수학 퀴즈에서 ${score}점을 획득했어요! 🎉\n정답률 ${total>0?Math.round(correct/total*100):0}% · ${total}문제 풀이\nhttps://mathert.pages.dev`;
  if(navigator.share){
    navigator.share({title:'수학 퀴즈 결과',text});
  }else{
    navigator.clipboard.writeText(text).then(()=>showToast('📋 클립보드에 복사됐어요!'));
  }
}

function logout(){
  authToken=null;currentUser=null;
  localStorage.removeItem('auth_token');
  score=0;streak=0;total=0;correct=0;
  updateStats();
  renderAuthArea();
  showTab('quiz');
}

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function startQuiz(){document.getElementById('setup-screen').style.display='none';document.getElementById('quiz-screen').style.display='block';document.getElementById('nav-back').style.visibility='visible';loadQuestion();}
function goSetup(){document.getElementById('setup-screen').style.display='block';document.getElementById('quiz-screen').style.display='none';document.getElementById('nav-back').style.visibility='hidden';}

function loadQuestion(){
  qNum++;
  document.getElementById('question-card').className='question-card';
  document.getElementById('feedback').className='feedback';
  document.getElementById('next-btn').style.display='none';
  document.getElementById('options-list').innerHTML='';
  document.getElementById('input-row').style.display='none';
  document.getElementById('sym-pad').classList.remove('show');
  const ai=document.getElementById('ans-input');
  ai.value='';ai.className='ans-input';ai.disabled=false;
  document.getElementById('confirm-btn').disabled=false;
  document.getElementById('q-num').textContent=qNum;
  document.getElementById('question-text').textContent='';

  const arr=[...selected];
  const gid=arr[rnd(0,arr.length-1)];
  const g=GRADES.find(x=>x.id===gid);
  let q=GENERATORS[gid]();
  // 단원 필터: 선택된 단원이 있으면 해당 단원 문제가 나올 때까지 재시도 (최대 10회)
  if(selectedUnits.size>0){
    let tries=0;
    while(!selectedUnits.has(q.unit)&&tries<20){
      const gid2=arr[rnd(0,arr.length-1)];
      q=GENERATORS[gid2]();
      tries++;
    }
  }

  document.getElementById('q-grade').textContent=g.label;
  document.getElementById('q-unit').textContent=q.unit;
  startTimer();
  document.getElementById('question-text').textContent=q.question;
  curFeedback=q;
  curAnswer=String(q.answer).trim();

  // 답이 숫자면 4지선다, 아니면 단답형
  const isNumeric=!isNaN(parseFloat(q.answer))&&String(q.answer).match(/^-?\d+(\.\d+)?$/);
  curType=isNumeric?'mcq':'short';

  if(curType==='mcq'){
    const ansNum=parseFloat(q.answer);
    const wrongs=makeOptions(q.answer,i=>{
      const deltas=[1,2,3,5,10,-1,-2,-3,-5,-10,0.5,-0.5,2.5,-2.5];
      return String(Math.round((ansNum+deltas[i%deltas.length])*100)/100);
    });
    const opts=shuffle([q.answer,...wrongs]);
    const correctIdx=opts.indexOf(q.answer);
    const list=document.getElementById('options-list');
    opts.forEach((opt,i)=>{
      const btn=document.createElement('button');
      btn.className='opt-btn';
      btn.innerHTML=`<span class="num">${i+1}</span><span>${opt}</span>`;
      btn.onclick=()=>pickOpt(i,correctIdx,btn,opts);
      list.appendChild(btn);
    });
  } else {
    document.getElementById('input-row').style.display='flex';
    document.getElementById('sym-pad').classList.add('show');
    const ai=document.getElementById('ans-input');
    ai.focus();
    ai.onkeydown=e=>{if(e.key==='Enter')submitAnswer();};
  }
}

function pickOpt(idx,correctIdx,btn,opts){
  document.querySelectorAll('.opt-btn').forEach(b=>b.disabled=true);
  const ok=idx===correctIdx;total++;
  btn.className='opt-btn '+(ok?'sel-correct':'sel-wrong');
  if(!ok)document.querySelectorAll('.opt-btn')[correctIdx].className='opt-btn show-correct';
  resolve(ok,opts[correctIdx]);
}


function insSymbol(s){
  const ai=document.getElementById('ans-input');
  const start=ai.selectionStart,end=ai.selectionEnd;
  ai.value=ai.value.slice(0,start)+s+ai.value.slice(end);
  ai.selectionStart=ai.selectionEnd=start+s.length;
  ai.focus();
}
function delSymbol(){
  const ai=document.getElementById('ans-input');
  const start=ai.selectionStart;
  if(start>0){ai.value=ai.value.slice(0,start-1)+ai.value.slice(start);ai.selectionStart=ai.selectionEnd=start-1;}
  ai.focus();
}
function submitAnswer(){
  const ai=document.getElementById('ans-input');
  const val=ai.value.trim();if(!val)return;
  ai.disabled=true;document.getElementById('confirm-btn').disabled=true;total++;
  // 정답 비교: 표기 방식 통일 후 비교
  function normalizeAns(s){
    return s.trim()
      .replace(/\s+/g,'')           // 공백 제거
      .replace(/×/g,'*')            // × → *
      .replace(/²/g,'^2')           // ² → ^2
      .replace(/³/g,'^3')           // ³ → ^3
      .replace(/⁴/g,'^4')           // ⁴ → ^4
      .toLowerCase();
  }
  const ok=normalizeAns(val)===normalizeAns(curAnswer)||(!isNaN(parseFloat(val))&&Math.abs(parseFloat(val)-parseFloat(curAnswer))<0.01);
  ai.className='ans-input '+(ok?'correct':'wrong');
  resolve(ok,curAnswer);
}

function resolve(ok,correctText){
  if(ok){correct++;streak++;score+=Math.max(10,10*streak);if(streak>=3)showToast(`🔥 ${streak}연속 정답!`);}
  else{streak=0;}
  document.getElementById('question-card').className='question-card '+(ok?'correct':'wrong');

  const fb=document.getElementById('feedback');
  fb.className='feedback '+(ok?'correct':'wrong')+' show';

  const q=curFeedback;
  const stepsHtml=(q.steps||[]).map((s,i)=>`
    <div class="step">
      <span class="step-num">${i+1}</span>
      <div class="step-body">
        ${s.title?`<div class="step-title">${s.title}</div>`:''}
        ${s.calc?`<div class="step-calc">${s.calc}</div>`:''}
        ${s.desc?`<div class="step-desc">${s.desc}</div>`:''}
      </div>
    </div>`).join('');

  fb.innerHTML=`
    <div class="feedback-top">${ok?'✅ 정답이에요!':'❌ 틀렸어요'}</div>
    ${!ok?`<div class="feedback-answer">정답: ${correctText}</div>`:''}
    ${stepsHtml?`<div class="steps">${stepsHtml}</div>`:''}
    ${q.concept?`<div class="concept-box"><div class="concept-label">핵심 개념</div><div class="concept-text">${q.concept}</div></div>`:''}
  `;

  updateStats();
  document.getElementById('next-btn').style.display='block';
  stopTimer();
  // 이번 문제 점수만 저장
  const thisScore=ok?Math.max(10,10*streak):0;
  const thisCorrect=ok?1:0;
  if(currentUser&&curFeedback){
    saveResult(curFeedback.unit,thisScore,thisCorrect,1,streak);
    if(!ok)saveWrongNote(curFeedback);
  }
}

initAuth();
</script>
